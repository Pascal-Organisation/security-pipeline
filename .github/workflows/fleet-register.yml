name: fleet-register

# Nightly: organisation repos (not archived, not forks) that fleet/repos.json does not list are proposed in ONE PR
# (branch bot/fleet-register, stub entries marked "todo"). Listing uses the fleet-bot App (Metadata read only); branch,
# commit and PR use the existing toolbox-pin App (Contents + Pull requests write on this repository only), so
# fleet-bot holds no code-write permission. Commits go through the contents API, GitHub signs them, no ruleset
# exclusion is needed (fleet/fleet-bot-app.md). Never merged by the bot.
# Inert until the variable FLEET_BOT_APP_ID is set AND the secrets TOOLBOX_PIN_APP_ID / TOOLBOX_PIN_APP_KEY exist (D-55).
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the missing repos and the resulting file, change nothing"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: fleet-register
  cancel-in-progress: false

jobs:
  register:
    name: Propose missing repos
    if: ${{ vars.FLEET_BOT_APP_ID != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      # No checkout: the script reads fleet/repos.json through the API and the job runs no repository code.
      # Secrets cannot be tested in a job-level if, so the toolbox-pin credentials are checked here.
      - name: Check toolbox-pin App credentials
        id: creds
        env:
          APP_ID: ${{ secrets.TOOLBOX_PIN_APP_ID }}
          APP_KEY: ${{ secrets.TOOLBOX_PIN_APP_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then echo "have=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::TOOLBOX_PIN_APP_ID / TOOLBOX_PIN_APP_KEY are not set: fleet-register skipped (docs/release.md, Toolbox pin automation)"; fi

      # Token 1 (fleet-bot) lists the organisation's repositories: Metadata read, installation-wide.
      - name: App token (list)
        id: list
        if: steps.creds.outputs.have == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.FLEET_BOT_APP_ID }}
          private-key: ${{ secrets.FLEET_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] Metadata read lists every repository of the organisation
          permission-metadata: read

      # Token 2 (toolbox-pin App) writes, to this repository only: Contents + Pull requests write, no Workflows.
      - name: App token (write)
        id: write
        if: steps.creds.outputs.have == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.TOOLBOX_PIN_APP_ID }}
          private-key: ${{ secrets.TOOLBOX_PIN_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Fetch the script from main
        if: steps.creds.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/fleet/register.sh?ref=main" > "$RUNNER_TEMP/register.sh"

      - name: Register
        if: steps.creds.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          GH_TOKEN_LIST: ${{ steps.list.outputs.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set -o pipefail
          bash "$RUNNER_TEMP/register.sh" | tee -a "$GITHUB_STEP_SUMMARY"
