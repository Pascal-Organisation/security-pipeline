name: fleet-register

# Nightly: organisation repos (not archived, not forks) that fleet/repos.json does not list are proposed in ONE PR
# (branch bot/fleet-register, stub entries marked "todo"). Commits go through the contents API as the fleet-bot App,
# so GitHub signs them and no ruleset exclusion is needed (fleet/fleet-bot-app.md). Never merged by the bot.
# Inert until the owner has created the fleet-bot App and set the variable FLEET_BOT_APP_ID (D-55).
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the missing repos and the resulting file, change nothing"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: fleet-register
  cancel-in-progress: false

jobs:
  register:
    name: Propose missing repos
    if: ${{ vars.FLEET_BOT_APP_ID != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      # No checkout: the script reads fleet/repos.json through the API and the job runs no repository code.
      # Token 1 lists the organisation's repositories (installation-wide, Metadata read).
      - name: App token (list)
        id: list
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FLEET_BOT_APP_ID }}
          private-key: ${{ secrets.FLEET_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] Metadata read lists every repository of the organisation
          permission-metadata: read

      # Token 2 writes, to this repository only: Contents + Pull requests write.
      - name: App token (write)
        id: write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FLEET_BOT_APP_ID }}
          private-key: ${{ secrets.FLEET_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Fetch the script from main
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/fleet/register.sh?ref=main" > "$RUNNER_TEMP/register.sh"

      - name: Register
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          GH_TOKEN_LIST: ${{ steps.list.outputs.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set -o pipefail
          bash "$RUNNER_TEMP/register.sh" | tee -a "$GITHUB_STEP_SUMMARY"
