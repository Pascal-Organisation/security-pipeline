## Weekly re-scan of the released image — reusable. Call it from a `schedule:` trigger.
##
## A release that was clean on build day picks up new CVEs every week. Until
## Dependency-Track is running, this re-scans ghcr.io/<repo>:latest (the image the hosts
## run or poll) with fresh vulnerability data and fails — so it shows up — when a fixable
## HIGH/CRITICAL appears. It never touches the host; the fix is a rebuild via Renovate
## or a manual release.
name: image-rescan (reusable)

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: latest

permissions: {}

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  rescan:
    name: Re-scan released image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: read # pull a private package
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # Trivy pulls the image itself with the registry credentials in its environment: no docker login,
      # pull or save. Docker only starts the pinned Trivy image (this workflow is GitHub-hosted only, and
      # Trivy is the only tool it needs, so it does not pull in the whole ci-toolbox).
      - name: Trivy (fixable HIGH/CRITICAL fail)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad tag"; exit 1; }
          out="$RUNNER_TEMP/rescan" && mkdir -p "$out" && chmod 0777 "$out"
          trivy() { docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v "$out:/out" "$TRIVY_IMAGE" "$@"; }
          ref="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          # Scan once into JSON (only what fails the gate survives the filters), print it, then decide.
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
            --format json --output /out/report.json "$ref"
          digest="$(jq -er '.Metadata.RepoDigests[0]' "$out/report.json")"
          echo "### Re-scan of \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          trivy convert --format table /out/report.json
          fixable="$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$out/report.json")"
          echo "Fixable HIGH/CRITICAL: $fixable"
          [ "$fixable" -eq 0 ] || { echo "::error::$fixable fixable HIGH/CRITICAL vulnerabilities in $digest"; exit 1; }
