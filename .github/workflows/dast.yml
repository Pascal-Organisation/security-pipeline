## DAST — reusable. Scans a running site from the outside.
##
##   OWASP ZAP baseline   spiders the site and checks responses passively (headers, cookies,
##                        CSP, information leaks). No attack traffic.
##   Nuclei               template checks for known misconfigurations, exposed files/panels,
##                        TLS problems and known CVEs of the detected stack.
##
## Gate: any High ZAP alert or high/critical Nuclei finding fails the job.
## Everything else is in the job summary and the uploaded reports.
##
## Call it against staging BEFORE the production deploy where a staging target exists
## (websiteghana: /release-test), otherwise right after the deploy against live.
## Only point it at sites you own.
##
## Always runs on GitHub-hosted runners, also for private repos: the targets are public
## URLs and nothing of the repo is checked out, so the self-hosted CI VM does not need
## egress to arbitrary sites (its allowlist stays: GitHub, registries, package indexes).
name: dast (reusable)

on:
  workflow_call:
    inputs:
      url:
        type: string
        required: true
      private-runner:
        description: "Deprecated, ignored: DAST always runs on GitHub-hosted runners."
        type: string
        default: ""
      zap-minutes:
        description: "ZAP spider duration in minutes."
        type: number
        default: 2

permissions: {}

env:
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab
  # Templates pinned to a release instead of "whatever is newest at scan time".
  NUCLEI_TEMPLATES_REF: "v10.5.1"
  NUCLEI_TEMPLATES_SHA: 79fb682760ab3d5b0e22afbb44709353cbebf023
  NUCLEI_IMAGE: projectdiscovery/nuclei:v3.11.1@sha256:582d5546902e67052097cb2d07296c642d50a1afc5e44623cb038845df9a32eb

jobs:
  zap:
    name: ZAP baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    env:
      TARGET: ${{ inputs.url }}
      MINUTES: ${{ inputs.zap-minutes }}
    steps:
      - name: ZAP baseline (block on High)
        run: |
          [[ "$TARGET" =~ ^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._~/-]*)?$ ]] || { echo "::error::bad url"; exit 1; }
          [[ "$MINUTES" =~ ^[0-9]{1,2}$ ]] || { echo "::error::bad zap-minutes"; exit 1; }
          out="$RUNNER_TEMP/zap" && mkdir -p "$out" && chmod 0777 "$out"   # container runs as uid zap
          # -I: warnings alone do not fail the scan; the gate below decides.
          # Exit codes: 0 pass, 1 fail, 2 warn, 3+ the scan itself broke. -I turns
          # warnings into 0; the risk gate below decides on findings.
          rc=0
          docker run --rm -v "$out:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$TARGET" -m "$MINUTES" -I -J zap.json -r zap.html || rc=$?
          [ "$rc" -le 2 ] || { echo "::error::ZAP scan failed to run (exit $rc)"; exit 1; }
          [ -s "$out/zap.json" ] || { echo "::error::ZAP produced no report"; exit 1; }
          {
            echo "### ZAP baseline — $TARGET"
            jq -r '.site[].alerts[] | "- **\(.riskdesc)** \(.alert) (\(.count) URL(s))"' "$out/zap.json"
          } >> "$GITHUB_STEP_SUMMARY"
          high="$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' "$out/zap.json")"
          echo "ZAP High alerts: $high"
          [ "$high" -eq 0 ] || { echo "::error::ZAP found $high High-risk alert(s)"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dast-zap
          path: ${{ runner.temp }}/zap/
          retention-days: 30
          if-no-files-found: ignore

  nuclei:
    name: Nuclei
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    env:
      TARGET: ${{ inputs.url }}
    steps:
      - name: Nuclei (block on high/critical)
        run: |
          [[ "$TARGET" =~ ^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._~/-]*)?$ ]] || { echo "::error::bad url"; exit 1; }
          out="$RUNNER_TEMP/nuclei" && mkdir -p "$out"
          tpl="$RUNNER_TEMP/nuclei-templates"
          git clone --quiet --depth 1 --branch "$NUCLEI_TEMPLATES_REF" https://github.com/projectdiscovery/nuclei-templates "$tpl"
          [ "$(git -C "$tpl" rev-parse HEAD)" = "$NUCLEI_TEMPLATES_SHA" ] || { echo "::error::nuclei-templates tag moved"; exit 1; }
          # Rate-limited, no fuzzing/intrusive templates: misconfig, exposure, TLS, known CVEs.
          # -duc/-ut off: no engine or template update at scan time.
          rc=0
          docker run --rm -v "$out:/out" -v "$tpl:/templates:ro" "$NUCLEI_IMAGE" \
            -u "$TARGET" -t /templates -tags misconfig,exposure,ssl,cve,tech \
            -exclude-tags intrusive,fuzz,dos -duc \
            -rl 20 -c 10 -nc -jsonl -o /out/nuclei.jsonl 2> "$out/nuclei.log" || rc=$?
          loaded="$(grep -oE 'Templates loaded for current scan: [0-9]+' "$out/nuclei.log" | grep -oE '[0-9]+$' || echo 0)"
          echo "Nuclei exit $rc, templates loaded: $loaded"
          [ "$rc" -eq 0 ] || { tail -20 "$out/nuclei.log"; echo "::error::Nuclei failed (exit $rc)"; exit 1; }
          [ "$loaded" -gt 0 ] || { tail -20 "$out/nuclei.log"; echo "::error::Nuclei loaded no templates — a scan without templates is not a pass"; exit 1; }
          touch "$out/nuclei.jsonl"
          {
            echo "### Nuclei — $TARGET"
            jq -r '"- **\(.info.severity)** \(.info.name) — \(."matched-at")"' "$out/nuclei.jsonl"
          } >> "$GITHUB_STEP_SUMMARY"
          bad="$(jq -s '[.[] | select(.info.severity == "high" or .info.severity == "critical")] | length' "$out/nuclei.jsonl")"
          echo "Nuclei high/critical: $bad"
          [ "$bad" -eq 0 ] || { echo "::error::Nuclei found $bad high/critical issue(s)"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dast-nuclei
          path: ${{ runner.temp }}/nuclei/
          retention-days: 30
          if-no-files-found: ignore
