## Container release — reusable. Call only from push to main (or a dispatch on main).
##
##   policy : the commit is on main, GitHub-verified, and the merge result of a PR
##   gate   : ci.yml, the same security-gate as on pull requests
##   build  : docker build -> Trivy image gate -> Syft SBOM (CycloneDX) -> push to GHCR
##            -> SLSA v1 provenance predicate for the pushed digest
##   sign   : keyless Cosign (GitHub OIDC -> Fulcio, logged in Rekor), on a GitHub-hosted runner
##
## All of it lives in this one workflow on purpose. Hosts accept only images signed by THIS
## file, so a valid signature proves policy and gate ran: a caller can drop a `needs`, but it
## cannot obtain this workflow's identity without running these jobs. That holds on GitHub
## Free too, where a private repo's main cannot be protected.
##
## Cost, accepted: Rekor is public, so repo and workflow names of private repos appear there.
## No code does.
##
## The image that is pushed is byte-for-byte the tar Trivy scanned — tag and push, never a
## rebuild. The signing job runs no third-party scanner and no repo code.
##
## Outputs image + digest.
name: build-container (reusable)

on:
  workflow_call:
    inputs:
      private-runner:
        description: 'runs-on for PRIVATE repos, as JSON. Ignored for public repos.'
        type: string
        default: '["self-hosted","ci"]'
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: "Dockerfile"
      target:
        description: "Optional build stage (docker build --target)."
        type: string
        default: ""
      submodules:
        description: "Check out git submodules for the build."
        type: boolean
        default: false
      sast-languages:
        description: "Passed to ci.yml (public repos)."
        type: string
        default: "actions"
      python-paths:
        description: "Passed to ci.yml (private Python repos)."
        type: string
        default: ""
      scan-skip-dirs:
        description: "Passed to ci.yml."
        type: string
        default: ""
    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}
      digest:
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

env:
  # Version of this pipeline; ends up in the provenance's builder.id. self-check keeps it
  # equal to the VERSION file and the release tag.
  PIPELINE_VERSION: v2.0.0
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  SYFT_IMAGE: anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a

jobs:
  # A direct push still lands in git on GitHub Free; it just never gets signed.
  policy:
    name: Release policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read      # the commit and its verification
      pull-requests: read # the PR it was merged from
    steps:
      - name: Commit is on main, verified, and a merged PR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::releases come from main only (got $GITHUB_REF)"; exit 1; }
          api() { curl -fsSL --max-time 20 -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$1"; }
          [ "$(api "commits/$GITHUB_SHA" | jq -r '.commit.verification.verified')" = true ] \
            || { echo "::error::$GITHUB_SHA has no verified signature"; exit 1; }
          api "commits/$GITHUB_SHA/pulls" \
            | jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)' > /dev/null \
            || { echo "::error::$GITHUB_SHA is not the merge result of a PR into main"; exit 1; }

  gate:
    name: Security
    needs: policy
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read # CodeQL needs workflow run metadata
      security-events: write # upload CodeQL results
    with:
      private-runner: ${{ inputs.private-runner }}
      sast-languages: ${{ inputs.sast-languages }}
      python-paths: ${{ inputs.python-paths }}
      dockerfile: ${{ inputs.dockerfile }}
      scan-skip-dirs: ${{ inputs.scan-skip-dirs }}

  build:
    name: Build, scan, SBOM, push
    needs: gate
    runs-on: ${{ needs.gate.outputs.private == 'true' && fromJSON(inputs.private-runner) || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push image, signatures and attestations to GHCR
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}

      # Isolated docker config: the registry login never lands in the runner user's ~/.docker.
      - name: Isolate docker config
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      - name: Build
        env:
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          TARGET: ${{ inputs.target }}
        run: |
          # Only main produces releases. Both signing paths depend on it: keyless binds
          # the certificate to the ref, and the key pair would otherwise sign any branch.
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::build-container runs only on refs/heads/main (got $GITHUB_REF)"; exit 1; }
          for v in "$CONTEXT" "$DOCKERFILE" "$TARGET"; do
            case "$v" in *..*|/*|*[!A-Za-z0-9_./-]*) echo "::error::input '$v' not allowed"; exit 1;; esac
          done
          LOCAL="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "LOCAL=$LOCAL" >> "$GITHUB_ENV"
          echo "TAR=$RUNNER_TEMP/image.tar" >> "$GITHUB_ENV"
          target=() ; [ -n "$TARGET" ] && target=(--target "$TARGET")
          # org.opencontainers.image.created is load-bearing: host deployers refuse any
          # image not built strictly later than the one running (replay protection).
          # --pull: never build on a base image another job left in the shared daemon.
          docker build --pull -f "$DOCKERFILE" "${target[@]}" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$LOCAL" "$CONTEXT"
          docker save "$LOCAL" -o "$RUNNER_TEMP/image.tar"

      # Gate: fixable HIGH/CRITICAL vulnerabilities and any embedded secret.
      # Report: everything else. Exceptions live in .security/exceptions.json (see ci.yml).
      - name: Trivy image (gate + report)
        run: |
          # Tool-neutral exceptions (.security/exceptions.json, see docs/switching-tools.md),
          # translated here so that replacing the scanner never touches a repo.
          ignore=() ; mounts=()
          if [ -f .security/exceptions.json ]; then
            jq -e 'all(.exceptions[];
                (.id | test("^[A-Za-z0-9._:/-]+$")) and (.reason | length > 0)
                and (.expires | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                and ((.kind // "vulnerability") | IN("vulnerability", "misconfiguration", "secret", "license")))' \
              .security/exceptions.json > /dev/null \
              || { echo "::error::.security/exceptions.json: every entry needs id, reason, expires (YYYY-MM-DD) and a known kind"; exit 1; }
            jq -r '.exceptions | group_by(.kind // "vulnerability")[] |
                (((.[0].kind // "vulnerability") | if . == "vulnerability" then "vulnerabilities" else . + "s" end) + ":"),
                (.[] | "  - id: \(.id)\n    statement: \(.reason | tojson)\n    expired_at: \(.expires)")' \
              .security/exceptions.json > "$RUNNER_TEMP/scanner-ignore.yaml"
            ignore=(--ignorefile /scanner-ignore.yaml)
            mounts=(-v "$RUNNER_TEMP/scanner-ignore.yaml:/scanner-ignore.yaml:ro")
          fi
          # Cache per run (see ci.yml), container as the runner user.
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          trivy() { docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e TRIVY_CACHE_DIR=/cache \
            -v "$TAR:/img.tar:ro" -v "$RUNNER_TEMP/trivy-cache:/cache" "${mounts[@]}" "$TRIVY_IMAGE" "$@"; }
          echo "::group::Full report (not gating)"
          trivy image --input /img.tar --scanners vuln,secret --exit-code 0 "${ignore[@]}"
          echo "::endgroup::"
          trivy image --input /img.tar --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --skip-db-update "${ignore[@]}"

      - name: SBOM (CycloneDX)
        run: |
          mkdir -p "$RUNNER_TEMP/attest"
          docker run --rm -v "$TAR:/img.tar:ro" "$SYFT_IMAGE" \
            docker-archive:/img.tar -o cyclonedx-json > "$RUNNER_TEMP/attest/sbom.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "$RUNNER_TEMP/attest/sbom.cdx.json" > /dev/null

      - id: push
        name: Push to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in latest "sha-${GITHUB_SHA}"; do
            docker tag "$LOCAL" "${IMAGE}:${tag}"
            # GHCR occasionally answers "unknown blob" mid-push; the tar is unchanged, so retry.
            for attempt in 1 2 3; do
              docker push --quiet "${IMAGE}:${tag}" && break
              [ "$attempt" -lt 3 ] || { echo "::error::push of ${tag} failed 3 times"; exit 1; }
              sleep $(( attempt * 15 ))
            done
          done
          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}:latest" \
            | grep "^${IMAGE}@" | head -1 | cut -d@ -f2)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::could not resolve the pushed digest"; exit 1; }
          docker logout ghcr.io
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # SLSA v1 provenance predicate. Honest level: it is written by steps of this
      # (user-controlled) job, not by the build platform, so it is SLSA Build L1 plus a
      # signature — not L2. L2/L3 need provenance generated by the platform itself
      # (slsa-github-generator / GitHub attestations on GitHub-hosted runners).
      - name: Provenance predicate
        env:
          BUILDER: https://github.com/Pascal-Organisation/security-pipeline/.github/workflows/build-container.yml@${{ env.PIPELINE_VERSION }}
          REPO_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          jq -n \
            --arg builder "$BUILDER" --arg repo "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" \
            --arg path "${WORKFLOW_REF#*/*/}" --arg event "$GITHUB_EVENT_NAME" --arg repo_id "$REPO_ID" \
            --arg owner_id "$OWNER_ID" --arg runner_env "$RUNNER_ENVIRONMENT" \
            --arg invocation "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            '{
              buildDefinition: {
                buildType: "https://actions.github.io/buildtypes/workflow/v1",
                externalParameters: { workflow: { ref: $ref, repository: ("https://github.com/" + $repo), path: ($path | sub("@.*$"; "")) } },
                internalParameters: { github: { event_name: $event, repository_id: $repo_id, repository_owner_id: $owner_id, runner_environment: $runner_env } },
                resolvedDependencies: [ { uri: ("git+https://github.com/" + $repo + "@" + $ref), digest: { gitCommit: $sha } } ]
              },
              runDetails: { builder: { id: $builder }, metadata: { invocationId: $invocation } }
            }' > "$RUNNER_TEMP/attest/provenance.json"
          echo "$IMAGE@$DIGEST" > "$RUNNER_TEMP/attest/subject.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestations
          path: ${{ runner.temp }}/attest/
          if-no-files-found: error
          retention-days: 7

      - name: Clean up
        if: always()
        run: |
          rm -rf "$DOCKER_CONFIG" "$RUNNER_TEMP/image.tar"
          docker image rm -f "$LOCAL" >/dev/null 2>&1 || true

  sign:
    name: Sign & attest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write # push image, signatures and attestations to GHCR
      id-token: write # OIDC token for Sigstore keyless signing
    env:
      REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attestations

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign, attest SBOM + provenance, verify
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::signing only on refs/heads/main"; exit 1; }
          [ "$(cat subject.txt)" = "$REF" ] || { echo "::error::attestation subject mismatch"; exit 1; }
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config" && mkdir -p "$DOCKER_CONFIG"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
          cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$REF"
          # Exactly what a host deployer checks: signed by THIS reusable workflow, for
          # this repository, from main.
          cosign verify "$REF" \
            --certificate-identity-regexp '^https://github\.com/Pascal-Organisation/security-pipeline/\.github/workflows/build-container\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref refs/heads/main > /dev/null
          docker logout ghcr.io
          echo "Signed $REF (keyless)" >> "$GITHUB_STEP_SUMMARY"
