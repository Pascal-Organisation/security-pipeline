## Container release — reusable. Call only from push to main (or a dispatch on main).
##
##   policy : the commit is on main, GitHub-verified, and the merge result of a PR
##   gate   : ci.yml, the same security-gate as on pull requests
##   build  : image tar (BuildKit v0.34.2: rootless `bk` in the CI cluster, buildx on GitHub-hosted) -> Trivy image gate on the
##            tar -> Syft SBOM (CycloneDX) from the tar -> crane pushes THAT tar to GHCR
##            -> Trivy JSON (vuln evidence) of the pushed image
##   sign   : SLSA v1 provenance built from OIDC claims + digest, keyless Cosign (GitHub OIDC -> Fulcio, logged in Rekor)
##            signature + SBOM/provenance/vuln attestations, on a GitHub-hosted runner
##
## All of it lives in this one workflow on purpose. Hosts accept only images signed by THIS
## file, so a valid signature proves policy and gate ran: a caller can drop a `needs`, but it
## cannot obtain this workflow's identity without running these jobs. That holds on GitHub
## Free too, where a private repo's main cannot be protected.
##
## Cost, accepted: Rekor is public, so repo and workflow names of private repos appear there.
## No code does.
##
## The image that is pushed is byte-for-byte what Trivy scanned: BuildKit writes an OCI tar, Trivy and
## Syft read it, crane pushes it (unpacked, never re-built or re-tagged by a daemon) and the digest crane
## reports must equal the manifest digest inside that tar. On our own machines no Docker daemon builds or pushes
## anything (v3); only on GitHub's throwaway VMs does the VM's own Docker host the BuildKit builder.
## The signing job runs no third-party scanner and no repo code.
## Private repos build in the CI cluster (scale set "arc-ci": fresh pod per job, user namespaces, not
## privileged; the pod is the ci-toolbox and runs BuildKit rootless, in-process); public repos on
## GitHub-hosted runners (owner rule: CI of public repos never runs on self-hosted machines). There the toolbox
## image is started with `docker run` (see ci.yml, `tb`), and the image is built by a buildx builder with the same
## BuildKit release, because hosted Ubuntu 24.04 blocks the user namespaces rootless BuildKit needs.
##
## Outputs image + digest.
name: build-container (reusable)

on:
  workflow_call:
    inputs:
      private-runner:
        description: "Deprecated, ignored (kept so that existing callers keep working): private repos always use the CI cluster (arc-ci)."
        type: string
        default: ""
      runner:
        description: "Runner scale set (label) for PRIVATE repos. Default is the production CI cluster; only set it to try another scale set. Public repos ignore it and always run GitHub-hosted."
        type: string
        default: "arc-ci"
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: "Dockerfile"
      target:
        description: "Optional build stage of the Dockerfile (BuildKit target)."
        type: string
        default: ""
      submodules:
        description: "Check out git submodules for the build."
        type: boolean
        default: false
      sast-languages:
        description: "Passed to ci.yml (public repos)."
        type: string
        default: "actions"
      python-paths:
        description: "Passed to ci.yml (private Python repos)."
        type: string
        default: ""
      scan-skip-dirs:
        description: "Passed to ci.yml."
        type: string
        default: ""
    secrets:
      # Optional: without them the SBOM upload to Dependency-Track is skipped, nothing else changes.
      DTRACK_API_KEY:
        description: "Dependency-Track API key (team Automation: BOM_UPLOAD, PROJECT_CREATION_UPLOAD)."
        required: false
      DTRACK_ACCESS_CLIENT_ID:
        description: "Cloudflare Access service token for dtrack.pascalhaag.de/api/v1/bom."
        required: false
      DTRACK_ACCESS_CLIENT_SECRET:
        required: false
    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}
      digest:
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

env:
  # Version of this pipeline; ends up in the provenance's builder.id. self-check keeps it
  # equal to the VERSION file and the release tag.
  PIPELINE_VERSION: v3.1.0
  # same pin as in ci.yml (Renovate moves both)
  TOOLBOX: ghcr.io/pascal-organisation/ci-toolbox:latest@sha256:61757ab62d17b7142f3305e5f5b20bb7cd4012c078c9d1bc2d7e2393fc66c61d

jobs:
  # A direct push still lands in git on GitHub Free; it just never gets signed.
  policy:
    name: Release policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read      # the commit and its verification
      pull-requests: read # the PR it was merged from
    steps:
      - name: Commit is on main, verified, and a merged PR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::releases come from main only (got $GITHUB_REF)"; exit 1; }
          api() { curl -fsSL --max-time 20 -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$1"; }
          [ "$(api "commits/$GITHUB_SHA" | jq -r '.commit.verification.verified')" = true ] \
            || { echo "::error::$GITHUB_SHA has no verified signature"; exit 1; }
          api "commits/$GITHUB_SHA/pulls" \
            | jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)' > /dev/null \
            || { echo "::error::$GITHUB_SHA is not the merge result of a PR into main"; exit 1; }

  gate:
    name: Security
    needs: policy
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read # CodeQL needs workflow run metadata
      security-events: write # upload CodeQL results
      packages: read # nested jobs pull the private ci-toolbox on GitHub-hosted runners
    with:
      runner: ${{ inputs.runner }}
      sast-languages: ${{ inputs.sast-languages }}
      python-paths: ${{ inputs.python-paths }}
      dockerfile: ${{ inputs.dockerfile }}
      scan-skip-dirs: ${{ inputs.scan-skip-dirs }}

  build:
    name: Build, scan, SBOM, push
    needs: gate
    runs-on: ${{ needs.gate.outputs.private == 'true' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push image, signatures and attestations to GHCR
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}

      # crane keeps its registry login in DOCKER_CONFIG (the standard location, no Docker needed):
      # in this job's temp dir only, never in a home directory.
      - name: Isolate registry config
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      # `tb <tool> ...`: see ci.yml. Here the wrapper also passes RUNNER_TEMP (state directory of `bk`) and
      # takes extra `docker run` options in TB_RUN_OPTS (GitHub-hosted only; the CI cluster ignores them).
      - name: Toolbox
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/tb"
          cat > "$RUNNER_TEMP/tb/tb" <<'EOF'
          #!/bin/sh
          [ -n "${TOOLBOX_NATIVE:-}" ] && exec "$@"
          # shellcheck disable=SC2086 # TB_RUN_OPTS is set by this workflow, never from an input
          exec docker run --rm $TB_RUN_OPTS -e HOME=/tmp -e DOCKER_CONFIG -e GITHUB_ACTIONS \
            -e RUNNER_TEMP \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" "$TOOLBOX" "$@"
          EOF
          chmod 755 "$RUNNER_TEMP/tb/tb"; echo "$RUNNER_TEMP/tb" >> "$GITHUB_PATH"
          if [ -z "${TOOLBOX_NATIVE:-}" ]; then
            # The toolbox package is private: pull with the job's GITHUB_TOKEN in a throwaway DOCKER_CONFIG,
            # deleted right after (the pinned image stays local). See ci.yml.
            export DOCKER_CONFIG="$RUNNER_TEMP/docker-pull"; mkdir -p "$DOCKER_CONFIG"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
            docker pull --quiet "$TOOLBOX" >/dev/null || { rm -rf "$DOCKER_CONFIG"; exit 1; }
            rm -rf "$DOCKER_CONFIG"
          fi

      - name: Build
        env:
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          TARGET: ${{ inputs.target }}
        run: |
          # Only main produces releases. Both signing paths depend on it: keyless binds
          # the certificate to the ref, and the key pair would otherwise sign any branch.
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::build-container runs only on refs/heads/main (got $GITHUB_REF)"; exit 1; }
          for v in "$CONTEXT" "$DOCKERFILE" "$TARGET"; do
            case "$v" in *..*|/*|*[!A-Za-z0-9_./-]*) echo "::error::input '$v' not allowed"; exit 1;; esac
          done
          TAR="$RUNNER_TEMP/image.tar"; echo "TAR=$TAR" >> "$GITHUB_ENV"
          # org.opencontainers.image.created is load-bearing: the updater in the app cluster refuses any
          # image not built strictly later than the one running (replay protection).
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          source="https://github.com/$GITHUB_REPOSITORY"
          stage=(); [ -n "$TARGET" ] && stage=("$TARGET")
          if [ -n "${TOOLBOX_NATIVE:-}" ]; then
            # CI cluster: `bk` (toolbox): rootless BuildKit, started in-process by buildctl-daemonless.sh: no
            # long-running daemon, no root, a fresh state directory per job (so no cache from other jobs) and
            # image-resolve-mode=pull, so base images are always resolved from the registry. BuildKit's process
            # sandbox stays on: the cluster pod has procMount Unmasked, for the fresh /proc of each RUN.
            opts=(--build-arg "GIT_SHA=$GITHUB_SHA"
                  --opt "label:org.opencontainers.image.created=$created"
                  --opt "label:org.opencontainers.image.revision=$GITHUB_SHA"
                  --opt "label:org.opencontainers.image.source=$source")
            tb bk "${stage[@]}" -C "$CONTEXT" -f "$DOCKERFILE" "${opts[@]}" --output "type=oci,dest=$TAR"
          else
            # GitHub-hosted (public repos; owner rule: public code never runs on self-hosted machines): rootless
            # BuildKit cannot start here, because hosted Ubuntu 24.04 restricts unprivileged user namespaces in
            # AppArmor on the host (v3.0.1: "fork/exec /proc/self/exe: permission denied"). Instead of lifting
            # that restriction, build with the VM's own Docker daemon and a buildx builder running the SAME
            # BuildKit release as the toolbox (v0.34.2, digest-pinned, rootful variant). The VM is GitHub's and
            # discarded after the job; the output is the same kind of OCI tar, so scan, SBOM, push and digest
            # check below are unchanged. No cache: fresh builder per job, --no-cache, --pull.
            docker buildx create --name "pipeline-$GITHUB_RUN_ID" --driver docker-container --use \
              --driver-opt "image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe" >/dev/null
            target=(); [ -n "$TARGET" ] && target=(--target "$TARGET")
            # --provenance/--sbom=false: one plain image manifest in index.json, like bk (provenance and SBOM are
            # produced and signed by this workflow, not by BuildKit).
            docker buildx build --pull --no-cache --provenance=false --sbom=false "${target[@]}" \
              -f "$DOCKERFILE" --build-arg "GIT_SHA=$GITHUB_SHA" \
              --label "org.opencontainers.image.created=$created" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=$source" \
              --output "type=oci,dest=$TAR" "$CONTEXT"
            docker buildx rm "pipeline-$GITHUB_RUN_ID" >/dev/null || true
          fi
          ls -la "$TAR"
          # Trivy cannot read an OCI-layout *tar* (only docker-archive tars or layout directories), Syft and crane
          # read the directory too: unpack once, every later step reads exactly these bytes.
          layout="$RUNNER_TEMP/image-layout"; mkdir -p "$layout"
          tar -xf "$TAR" -C "$layout"; echo "LAYOUT=$layout" >> "$GITHUB_ENV"

      # Gate: fixable HIGH/CRITICAL vulnerabilities and any embedded secret.
      # Report: everything else. Exceptions live in .security/exceptions.json (see ci.yml).
      - name: Trivy image (gate + report)
        run: |
          ignore=()
          if [ -f .security/exceptions.json ]; then
            jq -e 'all(.exceptions[];
                (.id | test("^[A-Za-z0-9._:/-]+$")) and (.reason | length > 0)
                and (.expires | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                and ((.kind // "vulnerability") | IN("vulnerability", "misconfiguration", "secret", "license")))' \
              .security/exceptions.json > /dev/null \
              || { echo "::error::.security/exceptions.json: every entry needs id, reason, expires (YYYY-MM-DD) and a known kind"; exit 1; }
            jq -r '.exceptions | group_by(.kind // "vulnerability")[] |
                (((.[0].kind // "vulnerability") | if . == "vulnerability" then "vulnerabilities" else . + "s" end) + ":"),
                (.[] | "  - id: \(.id)\n    statement: \(.reason | tojson)\n    expired_at: \(.expires)")' \
              .security/exceptions.json > "$RUNNER_TEMP/scanner-ignore.yaml"
            ignore=(--ignorefile "$RUNNER_TEMP/scanner-ignore.yaml")
          fi
          vex=(); [ -f .security/vex.openvex.json ] && vex=(--vex .security/vex.openvex.json)
          cache=(--cache-dir "$RUNNER_TEMP/trivy-cache")
          echo "::group::Full report (not gating)"
          tb trivy image "${cache[@]}" --input "$LAYOUT" --scanners vuln,secret --exit-code 0 "${ignore[@]}" "${vex[@]}"
          echo "::endgroup::"
          tb trivy image "${cache[@]}" --input "$LAYOUT" --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --skip-db-update "${ignore[@]}" "${vex[@]}"

      - name: SBOM (CycloneDX)
        run: |
          mkdir -p "$RUNNER_TEMP/attest"
          tb syft "oci-dir:$LAYOUT" -o cyclonedx-json > "$RUNNER_TEMP/attest/sbom.cdx.json"
          # OS packages: drop Syft's guessed CPEs. Distros backport fixes without changing the
          # upstream version, so NVD matching on cpe:...:openssl:3.5.7 reports CVEs Debian already
          # fixed. Without a CPE, Dependency-Track judges them by purl against OSV (Debian/Alpine
          # security trackers), the same data the Trivy gate uses. Language packages keep theirs.
          jq '.components |= map(if ((.purl // "") | test("^pkg:(deb|apk|rpm)/"))
                then del(.cpe) | .properties |= ((. // []) | map(select(.name != "syft:cpe23")))
                else . end)' "$RUNNER_TEMP/attest/sbom.cdx.json" > "$RUNNER_TEMP/attest/sbom.tmp"
          mv "$RUNNER_TEMP/attest/sbom.tmp" "$RUNNER_TEMP/attest/sbom.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "$RUNNER_TEMP/attest/sbom.cdx.json" > /dev/null

      # crane pushes the very image Trivy and Syft read: the unpacked OCI layout (no re-build, no re-tag);
      # crane cannot push an OCI-layout *tar* directly, only a directory.
      # Guard: BuildKit must have produced exactly one image manifest (no attestation index), and the digest
      # the registry ends up with must be that manifest's digest, i.e. what was scanned.
      - id: push
        name: Push to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          layout="$LAYOUT"
          scanned="$(jq -er 'select(.manifests | length == 1) | .manifests[0].digest' "$layout/index.json")" \
            || { echo "::error::expected exactly one manifest in the OCI index"; exit 1; }
          [[ "$scanned" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::odd manifest digest ($scanned)"; exit 1; }
          echo "$TOKEN" | tb crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          ref=""
          # GHCR occasionally answers "unknown blob" mid-push; the layout is unchanged, so retry.
          for attempt in 1 2 3; do
            ref="$(tb crane push "$layout" "${IMAGE}:sha-${GITHUB_SHA}")" && break
            [ "$attempt" -lt 3 ] || { echo "::error::push failed 3 times"; exit 1; }
            sleep $(( attempt * 15 ))
          done
          digest="${ref##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::could not resolve the pushed digest ($ref)"; exit 1; }
          [ "$digest" = "$scanned" ] || { echo "::error::pushed digest $digest differs from the scanned image $scanned"; exit 1; }
          tb crane tag "${IMAGE}@${digest}" latest
          rm -rf "$DOCKER_CONFIG"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Evidence for the vulnerability attestation (cosign "vuln" predicate, written by Trivy itself) of the exact
      # image that was scanned and pushed. Evidence only, not a trust input: the subject is the digest. Unfiltered
      # on purpose (no ignore file, unfixed included): consumers see what Trivy saw, not what was accepted. Vuln
      # scanner only, so no secret matches can end up in a public attestation. The provenance is NOT built here:
      # the sign job generates it from OIDC claims (see below).
      - name: Trivy vulnerability evidence
        run: |
          # VEX statements are the one input shared with the gate, so the evidence matches it.
          vex=(); [ -f .security/vex.openvex.json ] && vex=(--vex .security/vex.openvex.json)
          tb trivy image --cache-dir "$RUNNER_TEMP/trivy-cache" --input "$LAYOUT" --scanners vuln --skip-db-update \
            --format cosign-vuln --output "$RUNNER_TEMP/attest/vuln.json" "${vex[@]}"
          jq -e '.scanner.result != null and .scanner.uri != null' "$RUNNER_TEMP/attest/vuln.json" > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestations
          path: ${{ runner.temp }}/attest/
          if-no-files-found: error
          retention-days: 7

      # The registry login and the image bytes are removed for certain (a failure here fails the job). The state of
      # rootless BuildKit is not: its snapshots belong to subordinate uids of BuildKit's user namespace, which the
      # runner user cannot delete (v3.0.0 failed here, after the push, so signing was skipped). Delete it from
      # inside that namespace (rootlesskit, same uid mapping as `bk`) and only warn if that fails: the ARC pod and
      # the GitHub-hosted VM are discarded after the job anyway.
      - name: Clean up
        if: always()
        run: |
          rm -rf "$DOCKER_CONFIG" "$RUNNER_TEMP/image.tar" "$RUNNER_TEMP/image-layout"
          # GitHub-hosted only (the CI cluster ignores it): same profiles as the build, rootlesskit needs user namespaces.
          export TB_RUN_OPTS="--security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined"
          for d in "$RUNNER_TEMP/buildkit-state" "$RUNNER_TEMP/xdg-run"; do
            [ -e "$d" ] || continue
            tb rootlesskit rm -rf "$d" 2>/dev/null || rm -rf "$d" 2>/dev/null \
              || echo "::warning::could not fully remove $d (rootless BuildKit state; the runner is discarded after the job)"
          done

  sign:
    name: Sign & attest
    needs: [build, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write # push image, signatures and attestations to GHCR
      id-token: write # OIDC token for Sigstore keyless signing (and the claims the provenance is built from)
    env:
      REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attestations

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # SLSA v1 provenance, generated HERE from values the build job cannot influence: the claims of this
      # job's own OIDC token (issued by GitHub, bound to repository, ref, sha, run and to the reusable workflow
      # ref = builder id) plus the image digest from the job output. Nothing is read from a file the build job
      # produced (the artifact carries only SBOM + Trivy JSON: evidence, never trust input).
      - name: Provenance predicate (from OIDC claims)
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::odd digest"; exit 1; }
          tok="$(curl -fsS --max-time 20 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                   "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=provenance-claims" | jq -er .value)"
          echo "::add-mask::$tok"
          # Payload only; the token never leaves this step and is not used for authentication, the claims come
          # straight from GitHub over TLS.
          claims="$(printf '%s' "$tok" | jq -eR 'split(".")[1] | gsub("-"; "+") | gsub("_"; "/") | @base64d | fromjson')" \
            || { echo "::error::could not decode the OIDC claims"; exit 1; }
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
             '.repository == $repo and .sha == $sha and .ref == $ref and (.job_workflow_ref | test("/\\.github/workflows/build-container\\.yml@"))' \
             <<< "$claims" > /dev/null || { echo "::error::OIDC claims do not match the run context"; exit 1; }
          jq -n --argjson c "$claims" --arg digest "$DIGEST" --arg server "$GITHUB_SERVER_URL" \
            '{
              buildDefinition: {
                buildType: "https://actions.github.io/buildtypes/workflow/v1",
                externalParameters: { workflow: { ref: $c.ref, repository: ($server + "/" + $c.repository),
                  path: ($c.workflow_ref | sub("^[^/]+/[^/]+/"; "") | sub("@.*$"; "")) } },
                internalParameters: { github: { event_name: $c.event_name, repository_id: $c.repository_id,
                  repository_owner_id: $c.repository_owner_id, runner_environment: $c.runner_environment } },
                resolvedDependencies: [ { uri: ("git+" + $server + "/" + $c.repository + "@" + $c.ref), digest: { gitCommit: $c.sha } } ]
              },
              runDetails: {
                builder: { id: ($server + "/" + $c.job_workflow_ref) },
                metadata: { invocationId: ($server + "/" + $c.repository + "/actions/runs/" + $c.run_id + "/attempts/" + $c.run_attempt) }
              }
            }' > provenance.json
          jq -c '{builder: .runDetails.builder.id, subject: env.DIGEST}' provenance.json

      - name: Sign, attest SBOM + provenance + vulnerabilities, verify
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::signing only on refs/heads/main"; exit 1; }
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config" && mkdir -p "$DOCKER_CONFIG"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
          cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$REF"
          # https://cosign.sigstore.dev/attestation/vuln/v1: Trivy JSON of the exact scanned image
          cosign attest --yes --type vuln --predicate vuln.json "$REF"
          # Exactly what the cluster admission policy checks: signed by THIS reusable workflow, for
          # this repository, from main.
          cosign verify "$REF" \
            --certificate-identity-regexp '^https://github\.com/Pascal-Organisation/security-pipeline/\.github/workflows/build-container\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref refs/heads/main > /dev/null
          docker logout ghcr.io
          echo "Signed $REF (keyless)" >> "$GITHUB_STEP_SUMMARY"

  # The signed SBOM goes to Dependency-Track, which re-checks it against new CVEs every day.
  # Reporting only: an outage there must never stop a release that is already signed.
  sbom-upload:
    name: SBOM to Dependency-Track
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attestations

      - name: Upload
        env:
          DTRACK_URL: https://dtrack.pascalhaag.de
          API_KEY: ${{ secrets.DTRACK_API_KEY }}
          CF_ID: ${{ secrets.DTRACK_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.DTRACK_ACCESS_CLIENT_SECRET }}
          REPO: ${{ github.event.repository.name }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$CF_ID" ] || [ -z "$CF_SECRET" ]; then
            echo "Dependency-Track: no secrets passed, upload skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Version = commit; isLatest marks it as what main ships now, older versions stay for history.
          code="$(curl -sS -o resp.json -w '%{http_code}' -m 60 -X POST "$DTRACK_URL/api/v1/bom" \
            -H "X-Api-Key: $API_KEY" -H "CF-Access-Client-Id: $CF_ID" -H "CF-Access-Client-Secret: $CF_SECRET" \
            -F autoCreate=true -F isLatest=true -F "projectName=$REPO" -F "projectVersion=${GITHUB_SHA:0:12}" \
            -F "projectTags=image:${DIGEST#sha256:}" -F bom=@sbom.cdx.json)"
          if [ "$code" != 200 ]; then
            echo "::warning::Dependency-Track upload failed (HTTP $code)"
            exit 1
          fi
          echo "Dependency-Track: SBOM for $REPO@${GITHUB_SHA:0:12} uploaded (token $(jq -r .token resp.json))" >> "$GITHUB_STEP_SUMMARY"
