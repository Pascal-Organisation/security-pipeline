## CI gate — reusable. Every repo in Pascal-Organisation calls this on pull_request
## and on push. Nothing here builds a release or touches a host.
##
## Visibility is never taken from an input: the first job asks the API about the repository
## the run belongs to, and fails closed. (github.event.repository is not relied on, because
## it depends on the event's payload.) A public repo therefore ALWAYS runs on
## GitHub-hosted runners — fork PRs can never reach the self-hosted CI cluster.
##
##   public  -> ubuntu-24.04, CodeQL
##   private -> runner scale set "arc-ci" (Kubernetes, one fresh pod per job, user namespaces),
##              Semgrep (+ Bandit for Python)
##
## v3: no Docker daemon in jobs. Every tool comes from ONE digest-pinned image, the ci-toolbox
## (toolbox/Dockerfile). In the CI cluster the runner IS the toolbox; on GitHub-hosted runners the
## `tb` wrapper runs the same tool from the same image. Same steps, same tool versions everywhere.
##
## Stable contract: callers depend on the inputs below and on the single check
## "security-gate". Jobs are named after capabilities, never tools, so replacing a tool
## changes only this file and the toolbox (docs/switching-tools.md).
##
## Gates (fail the job): workflow lint (actionlint + zizmor >= medium), verified/unknown
## secrets (TruffleHog), SAST errors, fixable HIGH/CRITICAL vulnerabilities and
## HIGH/CRITICAL misconfigurations (Trivy), hadolint errors.
## Report-only: everything below those thresholds. Licences: deny-list gate, input `license-gate`
## (warn in v3.1.0, becomes fail in the next release). Public PRs also get dependency-review.
name: ci (reusable)

on:
  workflow_call:
    inputs:
      private-runner:
        description: "Deprecated, ignored (kept so that existing callers keep working): private repos always use the CI cluster (arc-ci)."
        type: string
        default: ""
      runner:
        description: "Runner scale set (label) for PRIVATE repos. Default is the production CI cluster; only set it to try another scale set. Public repos ignore it and always run GitHub-hosted."
        type: string
        default: "arc-ci"
      sast-languages:
        description: "Public repos: languages for SAST, comma-separated (e.g. python,actions). Empty skips SAST there."
        type: string
        default: "actions"
      python-paths:
        description: "Space-separated Python paths for the extra Python SAST (private repos). Empty skips it."
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile to lint. Empty skips the lint."
        type: string
        default: ""
      scan-skip-dirs:
        description: "Comma-separated directories the dependency/IaC scan should skip (e.g. src/themes)."
        type: string
        default: ""
      license-gate:
        description: "Licence deny-list gate: off | warn | fail. 'warn' in v3.1.0 (lists violations, does not fail); the default becomes 'fail' in the next release."
        type: string
        default: "warn"
      license-deny:
        description: "Comma-separated licence names/globs that are denied (SPDX ids, '*' wildcard, case-insensitive)."
        type: string
        default: "AGPL-3.0*,GPL-3.0*,SSPL-1.0"
    outputs:
      private:
        description: "'true' or 'false', from the API. build-container.yml picks its runner with it."
        value: ${{ jobs.visibility.outputs.private }}

permissions: {}

env:
  # The one image all tools come from (toolbox.yml builds and signs it). Renovate moves the pin.
  TOOLBOX: ghcr.io/pascal-organisation/ci-toolbox:latest@sha256:61757ab62d17b7142f3305e5f5b20bb7cd4012c078c9d1bc2d7e2393fc66c61d

jobs:
  visibility:
    name: Repository visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      private: ${{ steps.read.outputs.private }}
    steps:
      - id: read
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          private="$(curl -fsSL --max-time 20 -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" | jq -r '.private')"
          case "$private" in true|false) ;; *) echo "::error::could not read repository visibility"; exit 1;; esac
          echo "private=$private" >> "$GITHUB_OUTPUT"

  workflow-lint:
    name: Workflow lint
    needs: visibility
    runs-on: ${{ needs.visibility.outputs.private == 'true' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # pull the private ci-toolbox on GitHub-hosted runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `tb <tool> ...` runs a tool from the ci-toolbox, everywhere the same binary:
      #   CI cluster     the runner pod IS the toolbox (ENV TOOLBOX_NATIVE=1 in toolbox/Dockerfile): run natively,
      #                  no Docker anywhere.
      #   GitHub-hosted  `docker run` of the digest-pinned toolbox image. Docker is only the way to start
      #                  the image here (the host has it for free); no image is built; a short-lived GHCR login (GITHUB_TOKEN) is only used for the pull.
      #                  It runs as the image's own user (runner, uid 1001, the same uid as the host's runner
      #                  user), so files in the workspace keep their owner.
      - &toolbox
        name: Toolbox
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/tb"
          cat > "$RUNNER_TEMP/tb/tb" <<'EOF'
          #!/bin/sh
          [ -n "${TOOLBOX_NATIVE:-}" ] && exec "$@"
          exec docker run --rm -e HOME=/tmp -e GITHUB_ACTIONS -e ZIZMOR_GITHUB_TOKEN \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" "$TOOLBOX" "$@"
          EOF
          chmod 755 "$RUNNER_TEMP/tb/tb"; echo "$RUNNER_TEMP/tb" >> "$GITHUB_PATH"
          if [ -z "${TOOLBOX_NATIVE:-}" ]; then
            # The toolbox package is private: log in with the job's GITHUB_TOKEN (packages: read; the caller
            # repo needs Read under the package's "Manage Actions access"), pull, and delete the login at once.
            # The pinned image is local afterwards, `docker run` needs no registry access.
            export DOCKER_CONFIG="$RUNNER_TEMP/docker-pull"; mkdir -p "$DOCKER_CONFIG"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
            docker pull --quiet "$TOOLBOX" >/dev/null || { rm -rf "$DOCKER_CONFIG"; exit 1; }
            rm -rf "$DOCKER_CONFIG"
          fi

      - name: actionlint
        run: tb actionlint -color

      - name: zizmor (offline, fail on medium and above)
        run: tb zizmor --offline --min-severity medium .github/workflows/

      # Public repos only (GitHub-hosted): the online audits ask the GitHub API about the actions a
      # workflow uses (impostor commits, known-vulnerable actions, ref confusion, stale pins). The token
      # is this job's GITHUB_TOKEN, contents: read only, and is handed to this one step.
      - name: zizmor (online audits, public repos)
        if: ${{ needs.visibility.outputs.private == 'false' }}
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tb zizmor --min-severity medium .github/workflows/

  secrets:
    name: Secrets
    needs: visibility
    runs-on: ${{ needs.visibility.outputs.private == 'true' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pull the private ci-toolbox on GitHub-hosted runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - *toolbox
      # PR: the PR's commits. Push: the pushed commits. schedule/dispatch: full history.
      # verified = key still works; unknown = could not be checked. Both block.
      - name: TruffleHog (block on verified + unknown)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          range=()
          if [ "$EVENT" = pull_request ]; then
            range=(--since-commit "$PR_BASE" --branch "$PR_HEAD")
          elif [ "$EVENT" = push ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range=(--since-commit "$PUSH_BEFORE" --branch "$PUSH_AFTER")
          fi
          for v in "${range[@]}"; do [[ "$v" =~ ^(--since-commit|--branch|[0-9a-f]{40})$ ]] || { echo "::error::unexpected ref '$v'"; exit 1; }; done
          echo "scope: ${range[*]:-full history}"
          tb trufflehog git "file://$GITHUB_WORKSPACE" --results=verified,unknown --fail --no-update --github-actions "${range[@]}"

  sast-public:
    name: SAST (public)
    needs: visibility
    if: ${{ needs.visibility.outputs.private == 'false' && inputs.sast-languages != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # CodeQL needs workflow run metadata
      security-events: write # upload CodeQL results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ inputs.sast-languages }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: codeql

  sast-private:
    name: SAST (private)
    needs: visibility
    if: ${{ needs.visibility.outputs.private == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pull the private ci-toolbox on GitHub-hosted runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *toolbox
      # ERROR findings block, WARNING/INFO are listed in the job summary only.
      - name: Semgrep (block on ERROR)
        run: |
          out="$RUNNER_TEMP/semgrep" && mkdir -p "$out"
          tb semgrep scan --config p/default --metrics=off --quiet \
            --json-output="$out/semgrep.json" --sarif-output="$out/semgrep.sarif"
          {
            echo "### Semgrep"
            jq -r '.results[] | "- **\(.extra.severity)** `\(.check_id)` \(.path):\(.start.line)"' "$out/semgrep.json"
          } >> "$GITHUB_STEP_SUMMARY"
          errors="$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' "$out/semgrep.json")"
          echo "Semgrep ERROR findings: $errors"
          [ "$errors" -eq 0 ] || { echo "::error::Semgrep found $errors ERROR-severity issue(s)"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-report
          path: ${{ runner.temp }}/semgrep/
          retention-days: 14
          if-no-files-found: ignore

  sast-python:
    name: SAST (Python)
    needs: visibility
    if: ${{ needs.visibility.outputs.private == 'true' && inputs.python-paths != '' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # pull the private ci-toolbox on GitHub-hosted runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *toolbox
      # High severity with at least medium confidence blocks; the full list is printed.
      - name: Bandit
        env:
          PATHS: ${{ inputs.python-paths }}
        run: |
          case "$PATHS" in *[!A-Za-z0-9_./\ -]*) echo "::error::python-paths has unexpected characters"; exit 1;; esac
          # shellcheck disable=SC2086 # PATHS is a validated, space-separated list
          tb bandit -q -r $PATHS --exit-zero
          # shellcheck disable=SC2086
          tb bandit -q -r $PATHS --severity-level high --confidence-level medium

  dependencies:
    name: Dependencies & IaC
    needs: visibility
    runs-on: ${{ needs.visibility.outputs.private == 'true' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pull the private ci-toolbox on GitHub-hosted runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *toolbox
      # Accepted findings go into the repo's .security/exceptions.json, each with a reason
      # and an expiry date — an exception that is never revisited stops being one.
      - name: Trivy fs (gate + report)
        env:
          SKIP_DIRS: ${{ inputs.scan-skip-dirs }}
        run: |
          case "$SKIP_DIRS" in *[!A-Za-z0-9_./,-]*) echo "::error::scan-skip-dirs has unexpected characters"; exit 1;; esac
          skip=() ; [ -n "$SKIP_DIRS" ] && skip=(--skip-dirs "$SKIP_DIRS")
          # Tool-neutral exceptions (.security/exceptions.json, see docs/switching-tools.md),
          # translated here so that replacing the scanner never touches a repo.
          ignore=()
          if [ -f .security/exceptions.json ]; then
            jq -e 'all(.exceptions[];
                (.id | test("^[A-Za-z0-9._:/-]+$")) and (.reason | length > 0)
                and (.expires | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                and ((.owner | type) == "string" and (.owner | length > 0))
                and ((.kind // "vulnerability") | IN("vulnerability", "misconfiguration", "secret", "license")))' \
              .security/exceptions.json > /dev/null \
              || { echo "::error::.security/exceptions.json: every entry needs id, reason, owner, expires (YYYY-MM-DD) and a known kind"; exit 1; }
            jq -r '.exceptions | group_by(.kind // "vulnerability")[] |
                (((.[0].kind // "vulnerability") | if . == "vulnerability" then "vulnerabilities" else . + "s" end) + ":"),
                (.[] | "  - id: \(.id)\n    statement: \(.reason | tojson)\n    expired_at: \(.expires)")' \
              .security/exceptions.json > "$RUNNER_TEMP/scanner-ignore.yaml"
            ignore=(--ignorefile "$RUNNER_TEMP/scanner-ignore.yaml")
          fi
          # Optional OpenVEX statements (.security/vex.openvex.json): "not affected" findings are suppressed.
          vex=()
          if [ -f .security/vex.openvex.json ]; then
            jq -e '(.statements | type) == "array"' .security/vex.openvex.json > /dev/null \
              || { echo "::error::.security/vex.openvex.json is not an OpenVEX document"; exit 1; }
            vex=(--vex .security/vex.openvex.json)
          fi
          # Cache per run: never shared between jobs.
          cache=(--cache-dir "$RUNNER_TEMP/trivy-cache")
          echo "::group::Full report (not gating)"
          tb trivy fs "${cache[@]}" --scanners vuln,misconfig,license --license-full --exit-code 0 "${skip[@]}" "${ignore[@]}" "${vex[@]}" .
          echo "::endgroup::"
          tb trivy fs "${cache[@]}" --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --skip-db-update "${skip[@]}" "${ignore[@]}" "${vex[@]}" .

      # Licence deny-list. Package licences come from the manifests/lock files Trivy reads. An exception
      # (kind "license") matches the licence name or the package name. warn = list only, fail = block.
      - name: Licence gate (${{ inputs.license-gate }})
        if: ${{ !cancelled() && inputs.license-gate != 'off' }}
        env:
          MODE: ${{ inputs.license-gate }}
          DENY: ${{ inputs.license-deny }}
          SKIP_DIRS: ${{ inputs.scan-skip-dirs }}
        run: |
          case "$MODE" in warn|fail) ;; *) echo "::error::license-gate must be off, warn or fail"; exit 1;; esac
          case "$DENY" in ""|*[!A-Za-z0-9.,*+_-]*) echo "::error::license-deny is empty or has unexpected characters"; exit 1;; esac
          case "$SKIP_DIRS" in *[!A-Za-z0-9_./,-]*) echo "::error::scan-skip-dirs has unexpected characters"; exit 1;; esac
          skip=() ; [ -n "$SKIP_DIRS" ] && skip=(--skip-dirs "$SKIP_DIRS")
          out="$RUNNER_TEMP/license.json"
          tb trivy fs --cache-dir "$RUNNER_TEMP/trivy-cache" --scanners license --format json --output "$out" "${skip[@]}" .
          exc='[]'
          [ -f .security/exceptions.json ] && exc="$(jq -c --arg today "$(date -u +%F)" \
            '[.exceptions[]? | select((.kind // "") == "license" and ((.expires // "") >= $today)) | .id]' .security/exceptions.json)"
          jq -r --arg deny "$DENY" --argjson exc "$exc" '
            ($deny | split(",") | map(gsub("\\."; "\\.") | gsub("\\+"; "\\+") | gsub("\\*"; ".*") | "^" + . + "$")) as $pats
            | [.Results[]? | .Licenses[]?
               | select(.Name as $n | any($pats[]; . as $p | $n | test($p; "i")))
               | select((.Name | IN($exc[]) | not) and ((.PkgName // "") | IN($exc[]) | not))]
            | unique_by(.PkgName + "|" + .Name)[] | "\(.Name)\t\(.PkgName // .FilePath)"' "$out" > "$RUNNER_TEMP/license-hits.txt"
          n="$(wc -l < "$RUNNER_TEMP/license-hits.txt")"
          {
            echo "### Licence gate ($MODE): $n denied licence finding(s)"
            echo "Deny-list: \`$DENY\`"
            while IFS=$'\t' read -r lic pkg; do echo "- \`$lic\` in \`$pkg\`"; done < "$RUNNER_TEMP/license-hits.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$n" -eq 0 ] && exit 0
          cat "$RUNNER_TEMP/license-hits.txt"
          if [ "$MODE" = fail ]; then
            echo "::error::$n denied licence finding(s); fix them or add a kind=license exception with owner and expiry"; exit 1
          fi
          echo "::warning::$n denied licence finding(s). This gate is in warn mode and becomes fail in the next pipeline release."

  # Public repos only: Trivy findings in the Security tab. Needs security-events: write, so it is its
  # own job. Not part of security-gate (the gating scan is in `dependencies`); never blocks.
  trivy-sarif:
    name: Trivy SARIF (public)
    needs: visibility
    if: ${{ needs.visibility.outputs.private == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pull the private ci-toolbox on GitHub-hosted runners
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *toolbox
      - name: Trivy fs (SARIF)
        env:
          SKIP_DIRS: ${{ inputs.scan-skip-dirs }}
        run: |
          case "$SKIP_DIRS" in *[!A-Za-z0-9_./,-]*) echo "::error::scan-skip-dirs has unexpected characters"; exit 1;; esac
          skip=() ; [ -n "$SKIP_DIRS" ] && skip=(--skip-dirs "$SKIP_DIRS")
          ignore=() ; vex=()
          if [ -f .security/exceptions.json ]; then
            # validated in the `dependencies` job
            jq -r '.exceptions | group_by(.kind // "vulnerability")[] |
                (((.[0].kind // "vulnerability") | if . == "vulnerability" then "vulnerabilities" else . + "s" end) + ":"),
                (.[] | "  - id: \(.id)\n    statement: \(.reason | tojson)\n    expired_at: \(.expires)")' \
              .security/exceptions.json > "$RUNNER_TEMP/scanner-ignore.yaml"
            ignore=(--ignorefile "$RUNNER_TEMP/scanner-ignore.yaml")
          fi
          [ -f .security/vex.openvex.json ] && vex=(--vex .security/vex.openvex.json)
          mkdir -p "$RUNNER_TEMP/sarif"
          tb trivy fs --cache-dir "$RUNNER_TEMP/trivy-cache" --scanners vuln,misconfig --severity HIGH,CRITICAL \
            --format sarif --output "$RUNNER_TEMP/sarif/trivy.sarif" --exit-code 0 "${skip[@]}" "${ignore[@]}" "${vex[@]}" .
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        continue-on-error: true # code scanning may be off for the repo; the gate is `dependencies`
        with:
          sarif_file: ${{ runner.temp }}/sarif/trivy.sarif
          category: trivy-fs

  # 2.5: vulnerable or disallowed new dependencies in a PR (public repos: the dependency graph is free).
  dependency-review:
    name: Dependency review (public PRs)
    needs: visibility
    if: ${{ github.event_name == 'pull_request' && needs.visibility.outputs.private == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action fails with "not supported" when GitHub recognises no manifest in the repo (the SBOM
      # endpoint answers 404). That is not a finding: say so and skip. Any other probe error fails the job.
      - id: graph
        name: Probe the dependency graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/sbom")"
          case "$code" in
            200) echo "available=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Dependency review skipped::no manifests the dependency graph supports in this repository"
              echo "Dependency review skipped: no supported manifests (dependency graph SBOM returned 404)." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::dependency graph probe returned HTTP $code"; exit 1 ;;
          esac
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: ${{ steps.graph.outputs.available == 'true' }}
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # 2.7: report only (not in security-gate's needs). An expired exception already makes the finding block
  # again in `dependencies`; this lists them, and those about to expire, so they get revisited.
  exceptions-expiry:
    name: Exceptions expiry (report)
    needs: visibility
    runs-on: ${{ needs.visibility.outputs.private == 'true' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List expired and soon-expiring exceptions
        run: |
          [ -f .security/exceptions.json ] || { echo "no exceptions file"; exit 0; }
          today="$(date -u +%F)"; soon="$(date -u -d '+14 days' +%F)"
          jq -r --arg today "$today" --arg soon "$soon" '.exceptions[]?
              | select((.expires // "") < $soon)
              | (if .expires < $today then "EXPIRED" else "expires soon" end) + "\t\(.id)\t\(.expires)\t\(.owner // "NO OWNER")"' \
            .security/exceptions.json | sort > "$RUNNER_TEMP/expiry.txt"
          [ -s "$RUNNER_TEMP/expiry.txt" ] || { echo "no exception is expired or expiring within 14 days"; exit 0; }
          {
            echo "### Exceptions needing attention"
            while IFS=$'\t' read -r state id exp owner; do echo "- **$state** \`$id\` ($exp), owner: $owner"; done < "$RUNNER_TEMP/expiry.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r state id exp owner; do echo "::warning title=Exception $state::$id ($exp), owner: $owner"; done < "$RUNNER_TEMP/expiry.txt"

  dockerfile:
    name: Dockerfile lint
    needs: visibility
    if: ${{ inputs.dockerfile != '' }}
    runs-on: ${{ needs.visibility.outputs.private == 'true' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read # pull the private ci-toolbox on GitHub-hosted runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *toolbox
      - name: hadolint (fail on error)
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          case "$DOCKERFILE" in *..*|/*|*[!A-Za-z0-9_./-]*) echo "::error::dockerfile path not allowed"; exit 1;; esac
          tb hadolint --failure-threshold error "$DOCKERFILE"

  # Trial (report-only, not in security-gate's needs): a red check, even with
  # continue-on-error, would hold back Renovate's automerge. See docs/switching-tools.md.
  shell-lint:
    name: Shell lint (trial)
    needs: visibility
    runs-on: ${{ needs.visibility.outputs.private == 'true' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read # pull the private ci-toolbox on GitHub-hosted runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *toolbox
      - name: shellcheck (report only)
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          [ "${#files[@]}" -gt 0 ] || { echo "no shell scripts"; exit 0; }
          status=0
          tb shellcheck --severity=warning --format=gcc "${files[@]}" > "$RUNNER_TEMP/shellcheck.txt" || status=$?
          cat "$RUNNER_TEMP/shellcheck.txt"
          {
            echo "### Shell lint (trial)"
            echo "$(wc -l < "$RUNNER_TEMP/shellcheck.txt") finding(s) in ${#files[@]} script(s), exit $status"
          } >> "$GITHUB_STEP_SUMMARY"

  # Trial as well. The dependency scan reads files and never looks inside the images a
  # compose file names, so what actually runs on the hosts would otherwise go unscanned.
  runtime-images:
    name: Runtime images (trial)
    needs: visibility
    runs-on: ${{ needs.visibility.outputs.private == 'true' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pull the private ci-toolbox on GitHub-hosted runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *toolbox
      - name: Scan images named in compose files (report only)
        run: |
          mapfile -t composes < <(git ls-files '*compose*.yml' '*compose*.yaml')
          [ "${#composes[@]}" -gt 0 ] || { echo "no compose files"; exit 0; }
          # Images set through ${VAR} are this repo's own releases: build-container scans those.
          mapfile -t images < <(sed -nE "s/^[[:space:]]*image:[[:space:]]*['\"]?([^'\"#[:space:]\$]+)['\"]?[[:space:]]*(#.*)?$/\1/p" "${composes[@]}" | sort -u)
          echo "### Runtime images (trial)" >> "$GITHUB_STEP_SUMMARY"
          for image in "${images[@]}"; do
            [[ "$image" =~ ^[A-Za-z0-9._/:@-]+$ ]] || { echo "skipping odd image name"; continue; }
            # trivy pulls the image itself (no daemon)
            count="$(tb trivy image --cache-dir "$RUNNER_TEMP/trivy-cache" --quiet --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --format json "$image" \
              | jq '[.Results[]?.Vulnerabilities[]?] | length')" || count="scan failed"
            echo "- \`${image%%@*}\`: ${count} fixable HIGH/CRITICAL" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # The one check rulesets and release workflows depend on. New or replaced tools join
  # `needs` here; a tool under trial stays out of `needs` and reports without failing.
  security-gate:
    name: security-gate
    if: ${{ always() }}
    needs: [visibility, workflow-lint, secrets, sast-public, sast-private, sast-python, dependencies, dockerfile, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every capability passed (skipped only where not applicable)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e '[to_entries[] | select(.value.result != "success"
                    and (.value.result != "skipped"
                         or (.key | IN("sast-public", "sast-private", "sast-python", "dockerfile", "dependency-review") | not)))]
                 | length == 0' <<< "$RESULTS" > /dev/null \
            || { echo "::error::security gate failed"; exit 1; }
