## CI gate — reusable. Every repo in Pascal-Organisation calls this on pull_request
## and on push. Nothing here builds a release or touches a host.
##
## Visibility is never taken from an input: the first job asks the API about the repository
## the run belongs to, and fails closed. (github.event.repository is not relied on, because
## it depends on the event's payload.) A public repo therefore ALWAYS runs on
## GitHub-hosted runners — fork PRs can never reach the self-hosted CI cluster.
##
##   public  -> ubuntu-24.04, CodeQL
##   private -> runner scale set "arc-ci" (Kubernetes, one fresh pod per job, user namespaces),
##              Semgrep (+ Bandit for Python)
##
## v3: no Docker daemon in jobs. Every tool comes from ONE digest-pinned image, the ci-toolbox
## (toolbox/Dockerfile). In the CI cluster the runner IS the toolbox; on GitHub-hosted runners the
## `tb` wrapper runs the same tool from the same image. Same steps, same tool versions everywhere.
##
## Stable contract: callers depend on the inputs below and on the single check
## "security-gate". Jobs are named after capabilities, never tools, so replacing a tool
## changes only this file and the toolbox (docs/switching-tools.md).
##
## Gates (fail the job): workflow lint (actionlint + zizmor >= medium), verified/unknown
## secrets (TruffleHog), SAST errors, fixable HIGH/CRITICAL vulnerabilities and
## HIGH/CRITICAL misconfigurations (Trivy), hadolint errors.
## Report-only: everything below those thresholds, licences.
name: ci (reusable)

on:
  workflow_call:
    inputs:
      private-runner:
        description: "Deprecated, ignored (kept so that existing callers keep working): private repos always use the CI cluster (arc-ci)."
        type: string
        default: ""
      runner:
        description: "Runner scale set (label) for PRIVATE repos. Default is the production CI cluster; only set it to try another scale set. Public repos ignore it and always run GitHub-hosted."
        type: string
        default: "arc-ci"
      sast-languages:
        description: "Public repos: languages for SAST, comma-separated (e.g. python,actions). Empty skips SAST there."
        type: string
        default: "actions"
      python-paths:
        description: "Space-separated Python paths for the extra Python SAST (private repos). Empty skips it."
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile to lint. Empty skips the lint."
        type: string
        default: ""
      scan-skip-dirs:
        description: "Comma-separated directories the dependency/IaC scan should skip (e.g. src/themes)."
        type: string
        default: ""
    outputs:
      private:
        description: "'true' or 'false', from the API. build-container.yml picks its runner with it."
        value: ${{ jobs.visibility.outputs.private }}

permissions: {}

env:
  # The one image all tools come from (toolbox.yml builds and signs it). Renovate moves the pin.
  TOOLBOX: ghcr.io/pascal-organisation/ci-toolbox:latest@sha256:7455162143b9064fcff3bab659b14f6a1b4684c344b27b4e58d8f706dca84d31

jobs:
  visibility:
    name: Repository visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      private: ${{ steps.read.outputs.private }}
    steps:
      - id: read
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          private="$(curl -fsSL --max-time 20 -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" | jq -r '.private')"
          case "$private" in true|false) ;; *) echo "::error::could not read repository visibility"; exit 1;; esac
          echo "private=$private" >> "$GITHUB_OUTPUT"

  workflow-lint:
    name: Workflow lint
    needs: visibility
    runs-on: ${{ needs.visibility.outputs.private == 'true' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `tb <tool> ...` runs a tool from the ci-toolbox, everywhere the same binary:
      #   CI cluster     the runner pod IS the toolbox (ENV TOOLBOX_NATIVE=1 in toolbox/Dockerfile): run natively,
      #                  no Docker anywhere.
      #   GitHub-hosted  `docker run` of the digest-pinned toolbox image. Docker is only the way to start
      #                  the image here (the host has it for free); no image is built, no registry login.
      #                  It runs as the image's own user (runner, uid 1001, the same uid as the host's runner
      #                  user), so files in the workspace keep their owner.
      - &toolbox
        name: Toolbox
        run: |
          mkdir -p "$RUNNER_TEMP/tb"
          cat > "$RUNNER_TEMP/tb/tb" <<'EOF'
          #!/bin/sh
          [ -n "${TOOLBOX_NATIVE:-}" ] && exec "$@"
          exec docker run --rm -e HOME=/tmp -e GITHUB_ACTIONS \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" "$TOOLBOX" "$@"
          EOF
          chmod 755 "$RUNNER_TEMP/tb/tb"; echo "$RUNNER_TEMP/tb" >> "$GITHUB_PATH"
          [ -n "${TOOLBOX_NATIVE:-}" ] || docker pull --quiet "$TOOLBOX" >/dev/null

      - name: actionlint
        run: tb actionlint -color

      - name: zizmor (fail on medium and above)
        run: tb zizmor --offline --min-severity medium .github/workflows/

  secrets:
    name: Secrets
    needs: visibility
    runs-on: ${{ needs.visibility.outputs.private == 'true' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - *toolbox
      # PR: the PR's commits. Push: the pushed commits. schedule/dispatch: full history.
      # verified = key still works; unknown = could not be checked. Both block.
      - name: TruffleHog (block on verified + unknown)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          range=()
          if [ "$EVENT" = pull_request ]; then
            range=(--since-commit "$PR_BASE" --branch "$PR_HEAD")
          elif [ "$EVENT" = push ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range=(--since-commit "$PUSH_BEFORE" --branch "$PUSH_AFTER")
          fi
          for v in "${range[@]}"; do [[ "$v" =~ ^(--since-commit|--branch|[0-9a-f]{40})$ ]] || { echo "::error::unexpected ref '$v'"; exit 1; }; done
          echo "scope: ${range[*]:-full history}"
          tb trufflehog git "file://$GITHUB_WORKSPACE" --results=verified,unknown --fail --no-update --github-actions "${range[@]}"

  sast-public:
    name: SAST (public)
    needs: visibility
    if: ${{ needs.visibility.outputs.private == 'false' && inputs.sast-languages != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # CodeQL needs workflow run metadata
      security-events: write # upload CodeQL results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ inputs.sast-languages }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: codeql

  sast-private:
    name: SAST (private)
    needs: visibility
    if: ${{ needs.visibility.outputs.private == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *toolbox
      # ERROR findings block, WARNING/INFO are listed in the job summary only.
      - name: Semgrep (block on ERROR)
        run: |
          out="$RUNNER_TEMP/semgrep" && mkdir -p "$out"
          tb semgrep scan --config p/default --metrics=off --quiet \
            --json-output="$out/semgrep.json" --sarif-output="$out/semgrep.sarif"
          {
            echo "### Semgrep"
            jq -r '.results[] | "- **\(.extra.severity)** `\(.check_id)` \(.path):\(.start.line)"' "$out/semgrep.json"
          } >> "$GITHUB_STEP_SUMMARY"
          errors="$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' "$out/semgrep.json")"
          echo "Semgrep ERROR findings: $errors"
          [ "$errors" -eq 0 ] || { echo "::error::Semgrep found $errors ERROR-severity issue(s)"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-report
          path: ${{ runner.temp }}/semgrep/
          retention-days: 14
          if-no-files-found: ignore

  sast-python:
    name: SAST (Python)
    needs: visibility
    if: ${{ needs.visibility.outputs.private == 'true' && inputs.python-paths != '' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *toolbox
      # High severity with at least medium confidence blocks; the full list is printed.
      - name: Bandit
        env:
          PATHS: ${{ inputs.python-paths }}
        run: |
          case "$PATHS" in *[!A-Za-z0-9_./\ -]*) echo "::error::python-paths has unexpected characters"; exit 1;; esac
          # shellcheck disable=SC2086 # PATHS is a validated, space-separated list
          tb bandit -q -r $PATHS --exit-zero
          # shellcheck disable=SC2086
          tb bandit -q -r $PATHS --severity-level high --confidence-level medium

  dependencies:
    name: Dependencies & IaC
    needs: visibility
    runs-on: ${{ needs.visibility.outputs.private == 'true' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *toolbox
      # Accepted findings go into the repo's .security/exceptions.json, each with a reason
      # and an expiry date — an exception that is never revisited stops being one.
      - name: Trivy fs (gate + report)
        env:
          SKIP_DIRS: ${{ inputs.scan-skip-dirs }}
        run: |
          case "$SKIP_DIRS" in *[!A-Za-z0-9_./,-]*) echo "::error::scan-skip-dirs has unexpected characters"; exit 1;; esac
          skip=() ; [ -n "$SKIP_DIRS" ] && skip=(--skip-dirs "$SKIP_DIRS")
          # Tool-neutral exceptions (.security/exceptions.json, see docs/switching-tools.md),
          # translated here so that replacing the scanner never touches a repo.
          ignore=()
          if [ -f .security/exceptions.json ]; then
            jq -e 'all(.exceptions[];
                (.id | test("^[A-Za-z0-9._:/-]+$")) and (.reason | length > 0)
                and (.expires | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                and ((.kind // "vulnerability") | IN("vulnerability", "misconfiguration", "secret", "license")))' \
              .security/exceptions.json > /dev/null \
              || { echo "::error::.security/exceptions.json: every entry needs id, reason, expires (YYYY-MM-DD) and a known kind"; exit 1; }
            jq -r '.exceptions | group_by(.kind // "vulnerability")[] |
                (((.[0].kind // "vulnerability") | if . == "vulnerability" then "vulnerabilities" else . + "s" end) + ":"),
                (.[] | "  - id: \(.id)\n    statement: \(.reason | tojson)\n    expired_at: \(.expires)")' \
              .security/exceptions.json > "$RUNNER_TEMP/scanner-ignore.yaml"
            ignore=(--ignorefile "$RUNNER_TEMP/scanner-ignore.yaml")
          fi
          # Cache per run: never shared between jobs.
          cache=(--cache-dir "$RUNNER_TEMP/trivy-cache")
          echo "::group::Full report (not gating)"
          tb trivy fs "${cache[@]}" --scanners vuln,misconfig,license --license-full --exit-code 0 "${skip[@]}" "${ignore[@]}" .
          echo "::endgroup::"
          tb trivy fs "${cache[@]}" --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --skip-db-update "${skip[@]}" "${ignore[@]}" .

  dockerfile:
    name: Dockerfile lint
    needs: visibility
    if: ${{ inputs.dockerfile != '' }}
    runs-on: ${{ needs.visibility.outputs.private == 'true' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *toolbox
      - name: hadolint (fail on error)
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          case "$DOCKERFILE" in *..*|/*|*[!A-Za-z0-9_./-]*) echo "::error::dockerfile path not allowed"; exit 1;; esac
          tb hadolint --failure-threshold error "$DOCKERFILE"

  # Trial (report-only, not in security-gate's needs): a red check, even with
  # continue-on-error, would hold back Renovate's automerge. See docs/switching-tools.md.
  shell-lint:
    name: Shell lint (trial)
    needs: visibility
    runs-on: ${{ needs.visibility.outputs.private == 'true' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *toolbox
      - name: shellcheck (report only)
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          [ "${#files[@]}" -gt 0 ] || { echo "no shell scripts"; exit 0; }
          status=0
          tb shellcheck --severity=warning --format=gcc "${files[@]}" > "$RUNNER_TEMP/shellcheck.txt" || status=$?
          cat "$RUNNER_TEMP/shellcheck.txt"
          {
            echo "### Shell lint (trial)"
            echo "$(wc -l < "$RUNNER_TEMP/shellcheck.txt") finding(s) in ${#files[@]} script(s), exit $status"
          } >> "$GITHUB_STEP_SUMMARY"

  # Trial as well. The dependency scan reads files and never looks inside the images a
  # compose file names, so what actually runs on the hosts would otherwise go unscanned.
  runtime-images:
    name: Runtime images (trial)
    needs: visibility
    runs-on: ${{ needs.visibility.outputs.private == 'true' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *toolbox
      - name: Scan images named in compose files (report only)
        run: |
          mapfile -t composes < <(git ls-files '*compose*.yml' '*compose*.yaml')
          [ "${#composes[@]}" -gt 0 ] || { echo "no compose files"; exit 0; }
          # Images set through ${VAR} are this repo's own releases: build-container scans those.
          mapfile -t images < <(sed -nE "s/^[[:space:]]*image:[[:space:]]*['\"]?([^'\"#[:space:]\$]+)['\"]?[[:space:]]*(#.*)?$/\1/p" "${composes[@]}" | sort -u)
          echo "### Runtime images (trial)" >> "$GITHUB_STEP_SUMMARY"
          for image in "${images[@]}"; do
            [[ "$image" =~ ^[A-Za-z0-9._/:@-]+$ ]] || { echo "skipping odd image name"; continue; }
            # trivy pulls the image itself (no daemon)
            count="$(tb trivy image --cache-dir "$RUNNER_TEMP/trivy-cache" --quiet --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --format json "$image" \
              | jq '[.Results[]?.Vulnerabilities[]?] | length')" || count="scan failed"
            echo "- \`${image%%@*}\`: ${count} fixable HIGH/CRITICAL" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # The one check rulesets and release workflows depend on. New or replaced tools join
  # `needs` here; a tool under trial stays out of `needs` and reports without failing.
  security-gate:
    name: security-gate
    if: ${{ always() }}
    needs: [visibility, workflow-lint, secrets, sast-public, sast-private, sast-python, dependencies, dockerfile]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every capability passed (skipped only where not applicable)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e '[to_entries[] | select(.value.result != "success"
                    and (.value.result != "skipped"
                         or (.key | IN("sast-public", "sast-private", "sast-python", "dockerfile") | not)))]
                 | length == 0' <<< "$RESULTS" > /dev/null \
            || { echo "::error::security gate failed"; exit 1; }
