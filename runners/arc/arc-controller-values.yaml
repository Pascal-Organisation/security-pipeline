# Actions Runner Controller (gha-runner-scale-set-controller) 0.15.1, image pinned by digest.
# helm upgrade --install arc oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller \
#   --version 0.15.1 -n arc-systems --create-namespace -f arc-controller-values.yaml
image:
  repository: ghcr.io/actions/gha-runner-scale-set-controller
  tag: "0.15.1@sha256:4b51a20db717b194e2f3fa96cfe2ddcb21602811f79053c75fd1a383517b9f90"
  pullPolicy: IfNotPresent
flags:
  # only manage scale sets in the runner namespace
  watchSingleNamespace: arc-runners
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}
