# Org-level runner scale set "arc-ci" (gha-runner-scale-set 0.15.1).
# helm upgrade --install arc-ci oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#   --version 0.15.1 -n arc-runners -f scale-set-values.yaml
#
# One fresh pod per job (ephemeral), runc, own Linux user namespace (hostUsers: false), no Docker daemon:
# images are built by rootless BuildKit inside the pod (the ci-toolbox image, see toolbox/Dockerfile and
# docs/runners.md). The job cannot touch the node, other jobs or another repo's build.
#
# The ci-toolbox package is private: the pods need an imagePullSecret (read:packages):
#   kubectl -n arc-runners create secret docker-registry ghcr-pull --docker-server=ghcr.io \
#     --docker-username=<user> --docker-password=<token>
#
# What rootless BuildKit needs on top of the defaults (each one tested):
#   - seccomp Unconfined (rootlesskit: clone/unshare(CLONE_NEWUSER)) and AppArmor Unconfined (its mounts);
#   - procMount Unmasked (only allowed with hostUsers: false): runc mounts a fresh /proc for every RUN step;
#   - allowPrivilegeEscalation true + caps SETUID/SETGID: the setuid newuidmap/newgidmap map the sub-ids.
# Unconfined is acceptable only because the pod has no capabilities in the *host* namespace; the namespace must
# not be PSA-enforced "baseline"/"restricted".
#
# ARC applies labels (scaleSetLabels / runnerScaleSetName) only when the scale set is created: changing them
# needs helm uninstall + install. Never change the template while a runner has a job.
githubConfigUrl: https://github.com/Pascal-Organisation
githubConfigSecret: arc-github-app   # github_app_id, github_app_installation_id, github_app_private_key
runnerGroup: Default
runnerScaleSetName: arc-ci
scaleSetLabels: [arc-ci]
minRunners: 0
# One job at a time: a heavy build (Go + pip installs) peaked at 1.8 GB cgroup memory on a 5 GB node.
maxRunners: 1
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

listenerTemplate:
  spec:
    containers:
    - name: listener
      resources:
        requests: {cpu: 20m, memory: 32Mi}
        limits: {memory: 128Mi}

template:
  spec:
    hostUsers: false
    imagePullSecrets:
    - name: ghcr-pull
    automountServiceAccountToken: false
    securityContext:
      runAsUser: 1001          # "runner" in actions-runner / ci-toolbox
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile: {type: Unconfined}
      appArmorProfile: {type: Unconfined}
    containers:
    - name: runner
      # Digest of the cosign-signed ci-toolbox (toolbox.yml, main, 69380a3); verified with
      #   cosign verify <image>@<digest> --certificate-identity \
      #     https://github.com/Pascal-Organisation/security-pipeline/.github/workflows/toolbox.yml@refs/heads/main \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      image: ghcr.io/pascal-organisation/ci-toolbox@sha256:61757ab62d17b7142f3305e5f5b20bb7cd4012c078c9d1bc2d7e2393fc66c61d
      command: ["/home/runner/run.sh"]
      env:
      # rootless BuildKit: socket/state locations that are writable for uid 1001 (no /run/user/1001 in the image)
      - {name: XDG_RUNTIME_DIR, value: /home/runner/_xdg}
      - {name: BUILDKITD_FLAGS, value: ""}
      securityContext:
        privileged: false
        procMount: Unmasked
        allowPrivilegeEscalation: true
        capabilities: {drop: [ALL], add: [SETUID, SETGID]}
      resources:
        requests: {cpu: "1", memory: 2Gi}
        # Hard cap so a runaway build is OOM-killed inside its own cgroup instead of starving k3s.
        limits: {cpu: "3", memory: 3Gi}
      volumeMounts:
      - {name: work, mountPath: /home/runner/_work}
      - {name: xdg, mountPath: /home/runner/_xdg}
      - {name: buildkit, mountPath: /home/runner/.local/share/buildkit}
      - {name: tmp, mountPath: /tmp}
    volumes:
    # disk-backed emptyDirs (not medium: Memory): layer stores of a build must not count as RAM
    - {name: work, emptyDir: {sizeLimit: 15Gi}}
    - {name: xdg, emptyDir: {sizeLimit: 64Mi}}
    - {name: buildkit, emptyDir: {sizeLimit: 20Gi}}
    - {name: tmp, emptyDir: {sizeLimit: 10Gi}}
