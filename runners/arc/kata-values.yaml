# kata-deploy 4.3.1 on single-node k3s: only the QEMU shim, runtime class "kata-qemu".
# helm upgrade --install kata-deploy oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy \
#   --version 4.3.1 -n kube-system -f kata-values.yaml
deploymentMode: daemonset
k8sDistribution: k3s
image:
  reference: quay.io/kata-containers/kata-deploy
  tag: "4.3.1@sha256:7399058e3e6378a766770345abcf9b20b53611a419b1b56e71162c6ac1bf625a"
kubectlImage:
  reference: quay.io/kata-containers/kubectl
  tag: "v1.37.2@sha256:623ab96ae28523ae72dea49d0e7a3909afab71d49a552c26f57c62950fe4bbda"
imagePullPolicy: IfNotPresent
shims:
  disableAll: true
  qemu:
    enabled: true
defaultShim:
  amd64: qemu
runtimeClasses:
  enabled: true
  createDefault: false
